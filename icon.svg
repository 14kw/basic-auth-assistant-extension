    fill-opacity="0.1"
    stroke="#FFFFFF"
    stroke-opacity="0.25"
    stroke-width="2"
  />

  <g filter="url(#shadow)">
    <path
      d="M43 61V52c0-12.2 9.4-22 21-22s21 9.8 21 22v9"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="10"
      stroke-linecap="round"
    />
    <rect x="31" y="56" width="66" height="51" rx="14" fill="#FFFFFF" />
    <path
      d="M70.5 79.5a6.5 6.5 0 1 0-10 5.5v9a3.5 3.5 0 0 0 7 0v-9a6.5 6.5 0 0 0 3-5.5Z"
      fill="url(#keyhole)"
    />
  </g>

  <circle cx="27" cy="28" r="4" fill="#FFFFFF" fill-opacity="0.9" />
  <circle cx="101" cy="28" r="4" fill="#FFFFFF" fill-opacity="0.65" />
