<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title description">
  <title id="title">Basic Auth Assistant icon</title>
  <desc id="description">A white padlock on a blue shield-shaped background.</desc>

  <defs>
    <linearGradient id="background" x1="18" y1="14" x2="110" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B6CFF" />
      <stop offset="0.52" stop-color="#315CF4" />
      <stop offset="1" stop-color="#168ED9" />
    </linearGradient>
    <linearGradient id="keyhole" x1="64" y1="73" x2="64" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#315CF4" />
      <stop offset="1" stop-color="#168ED9" />
    </linearGradient>
    <filter id="shadow" x="14" y="18" width="100" height="104" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#14275D" flood-opacity="0.24" />
    </filter>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="29" fill="url(#background)" />

  <path
    d="M25 41.5 64 23l39 18.5v25.8c0 22.2-15.7 39-39 47.7-23.3-8.7-39-25.5-39-47.7V41.5Z"
